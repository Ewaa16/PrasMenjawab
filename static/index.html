<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrasMenjawab - Asisten Belajar</title>
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #070b14;
            color: #e6eaf2;
            overflow: hidden;
        }

        /* ---------- Landing ---------- */
        #landing {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            background:
                linear-gradient(180deg, rgba(7,11,20,.45) 0%, rgba(7,11,20,.78) 60%, rgba(7,11,20,.96) 100%),
                url("/static/bg.jpg") center/cover no-repeat;
            z-index: 2;
            transition: opacity .35s ease, transform .35s ease;
        }
        #landing.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.03);
        }
        .brand-logo {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 8px 32px rgba(0,0,0,.55), 0 0 0 3px rgba(255,255,255,.08);
            margin-bottom: 18px;
        }
        #landing h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -.5px;
            background: linear-gradient(90deg, #818cf8, #22d3ee);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tagline {
            margin-top: 8px;
            color: #a5b0c6;
            font-size: 15px;
            max-width: 440px;
        }
        .landing-input-row {
            margin-top: 30px;
            width: 100%;
            max-width: 640px;
            display: flex;
            gap: 10px;
            background: rgba(20, 28, 48, .72);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 999px;
            padding: 6px 6px 6px 22px;
            backdrop-filter: blur(14px);
            box-shadow: 0 12px 40px rgba(0,0,0,.45);
            transition: border-color .2s ease;
        }
        .landing-input-row:focus-within { border-color: rgba(129,140,248,.7); }
        .landing-input-row textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e6eaf2;
            font-size: 16px;
            font-family: inherit;
            resize: none;
            padding: 12px 0;
            max-height: 120px;
            line-height: 1.4;
        }
        .landing-input-row textarea::placeholder { color: #7d89a5; }
        .send-btn {
            width: 46px;
            height: 46px;
            flex: 0 0 46px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #22d3ee);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .15s ease, filter .15s ease;
        }
        .send-btn:hover { filter: brightness(1.12); transform: scale(1.04); }
        .send-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

        .chips {
            margin-top: 22px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 640px;
        }
        .chip {
            background: rgba(20, 28, 48, .66);
            border: 1px solid rgba(255,255,255,.14);
            color: #cdd6e8;
            border-radius: 999px;
            padding: 9px 16px;
            font-size: 13.5px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background .15s ease, border-color .15s ease, transform .1s ease;
        }
        .chip:hover {
            background: rgba(99, 102, 241, .28);
            border-color: rgba(129,140,248,.6);
            transform: translateY(-1px);
        }
        .landing-footer {
            position: absolute;
            bottom: 22px;
            font-size: 12px;
            color: #5f6b85;
        }

        /* ---------- Chat ---------- */
        #chatView {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: radial-gradient(1200px 500px at 50% -10%, rgba(99,102,241,.12), transparent 60%), #070b14;
            opacity: 0;
            pointer-events: none;
            transition: opacity .35s ease;
        }
        #chatView.active { opacity: 1; pointer-events: auto; }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(10, 15, 28, .9);
            border-bottom: 1px solid rgba(255,255,255,.07);
            backdrop-filter: blur(10px);
            flex: 0 0 auto;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .brand img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }
        .brand span {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .top-actions { display: flex; gap: 8px; }
        .icon-btn {
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.12);
            color: #cdd6e8;
            border-radius: 10px;
            width: 38px;
            height: 38px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s ease, color .15s ease;
        }
        .icon-btn:hover { background: rgba(255,255,255,.12); }
        .icon-btn.danger:hover { background: rgba(239,68,68,.18); color: #fca5a5; border-color: rgba(239,68,68,.4); }
        .icon-btn:disabled { opacity: .4; cursor: not-allowed; }

        .history-toggle {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 50;
            background: rgba(20, 28, 48, .72);
            border: 1px solid rgba(255,255,255,.14);
            color: #cdd6e8;
            border-radius: 12px;
            width: 42px;
            height: 42px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: background .15s ease;
        }
        .history-toggle:hover { background: rgba(99,102,241,.28); }

        /* ---------- Sidebar ---------- */
        .backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            z-index: 60;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease;
        }
        .backdrop.show { opacity: 1; pointer-events: auto; }
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 300px;
            max-width: 85vw;
            background: #0c1220;
            border-right: 1px solid rgba(255,255,255,.08);
            z-index: 70;
            transform: translateX(-100%);
            transition: transform .28s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 8px 0 32px rgba(0,0,0,.4);
        }
        #sidebar.open { transform: translateX(0); }
        .sidebar-head {
            padding: 18px 16px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex: 0 0 auto;
        }
        .sidebar-head h2 { font-size: 16px; font-weight: 600; }
        .new-chat-btn {
            background: linear-gradient(135deg, #6366f1, #22d3ee);
            border: none;
            color: #fff;
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: filter .15s ease, transform .1s ease;
        }
        .new-chat-btn:hover { filter: brightness(1.12); transform: translateY(-1px); }
        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .conv-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background .12s ease;
        }
        .conv-item:hover { background: rgba(255,255,255,.05); }
        .conv-item.active { background: rgba(99,102,241,.18); border-color: rgba(129,140,248,.3); }
        .conv-main { flex: 1; min-width: 0; }
        .conv-title {
            font-size: 13.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-meta { font-size: 11.5px; color: #6b7694; margin-top: 2px; }
        .conv-del {
            background: transparent;
            border: none;
            color: #6b7694;
            font-size: 16px;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            cursor: pointer;
            flex: 0 0 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity .12s ease, color .12s ease, background .12s ease;
        }
        .conv-item:hover .conv-del { opacity: 1; }
        .conv-del:hover { color: #fca5a5; background: rgba(239,68,68,.18); }
        .sidebar-empty {
            padding: 24px 16px;
            text-align: center;
            color: #5f6b85;
            font-size: 13px;
            line-height: 1.6;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }
        #chat::-webkit-scrollbar, .sidebar-list::-webkit-scrollbar { width: 8px; }
        #chat::-webkit-scrollbar-thumb, .sidebar-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }
        #chat::-webkit-scrollbar-thumb:hover, .sidebar-list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.22); }
        #chat::-webkit-scrollbar-track, .sidebar-list::-webkit-scrollbar-track { background: transparent; }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px) scale(.99); }
            to { opacity: 1; transform: none; }
        }
        .msg-row {
            display: flex;
            gap: 12px;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            animation: msgIn .32s ease both;
        }
        .msg-row.user { flex-direction: row-reverse; margin-left: auto; justify-content: flex-end; }
        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            flex: 0 0 36px;
            margin-top: 2px;
            box-shadow: 0 0 0 2px rgba(129,140,248,.30), 0 4px 16px rgba(99,102,241,.35);
        }
        .msg-avatar.user {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 2px rgba(168,85,247,.30), 0 4px 16px rgba(99,102,241,.30);
        }
        .msg-body { display: flex; flex-direction: column; min-width: 0; }
        .msg-row.user .msg-body { align-items: flex-end; }
        .msg-meta {
            font-size: 11.5px;
            color: #6b7694;
            margin-bottom: 4px;
            padding: 0 4px;
        }
        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14.5px;
            line-height: 1.6;
            word-break: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }
        .msg-row.bot .bubble {
            background: linear-gradient(180deg, rgba(30, 41, 66, .92), rgba(21, 29, 50, .9));
            border: 1px solid rgba(255,255,255,.08);
            border-top-left-radius: 4px;
            box-shadow: 0 6px 20px rgba(0,0,0,.28);
        }
        .msg-row.user .bubble {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-top-right-radius: 4px;
            box-shadow: 0 6px 20px rgba(99,102,241,.35);
        }
        .msg-row.error .bubble {
            background: rgba(127, 29, 29, .55);
            border: 1px solid rgba(239,68,68,.35);
        }
        .cursor::after {
            content: "▋";
            color: #818cf8;
            animation: blink 1s steps(2) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .bubble h1, .bubble h2, .bubble h3 { margin: 10px 0 6px; line-height: 1.3; }
        .bubble h1 { font-size: 19px; } .bubble h2 { font-size: 17px; } .bubble h3 { font-size: 15.5px; }
        .bubble p { margin: 6px 0; }
        .bubble ul, .bubble ol { margin: 6px 0; padding-left: 22px; }
        .bubble li { margin: 3px 0; }
        .bubble code {
            background: rgba(255,255,255,.1);
            border-radius: 5px;
            padding: 2px 6px;
            font-family: "Cascadia Code", Consolas, monospace;
            font-size: 13px;
        }
        .bubble pre {
            position: relative;
            background: #0b1120;
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 10px;
            padding: 42px 14px 12px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .bubble pre code { background: transparent; padding: 0; font-size: 13px; display: block; white-space: pre; }
        .code-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 10px 7px 14px;
            background: rgba(255,255,255,.05);
            border-bottom: 1px solid rgba(255,255,255,.08);
            border-radius: 10px 10px 0 0;
            font-size: 12px;
            color: #8b96b0;
        }
        .copy-btn {
            background: rgba(255,255,255,.08);
            border: none;
            color: #cdd6e8;
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 11.5px;
            cursor: pointer;
            transition: background .12s ease;
        }
        .copy-btn:hover { background: rgba(129,140,248,.3); }
        .bubble a { color: #7dd3fc; }

        .chat-input-row {
            flex: 0 0 auto;
            padding: 12px 16px 18px;
            display: flex;
            justify-content: center;
        }
        .chat-input-row .landing-input-row { margin-top: 0; }

        .hidden { display: none !important; }

        @media (max-width: 600px) {
            #landing h1 { font-size: 27px; }
            .brand-logo { width: 72px; height: 72px; }
            .landing-input-row { max-width: 100%; padding-left: 16px; }
            .bubble { font-size: 14px; }
            #chat { padding: 16px 10px 14px; }
            .topbar { padding: 10px 12px; }
            .history-toggle { top: 10px; left: 10px; width: 38px; height: 38px; }
        }
    </style>
</head>
<body>

    <button class="history-toggle" id="historyToggle" title="Riwayat percakapan">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#cdd6e8" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <div class="backdrop" id="backdrop"></div>

    <div id="sidebar">
        <div class="sidebar-head">
            <h2>Riwayat</h2>
            <button class="new-chat-btn" id="newChatBtn">+ Percakapan baru</button>
        </div>
        <div class="sidebar-list" id="sidebarList"></div>
    </div>

    <div id="landing">
        <img class="brand-logo" src="/static/logo.jpg" alt="Logo PrasMenjawab" />
        <h1>PrasMenjawab</h1>
        <p class="tagline">Asisten AI untuk belajar coding. Tanya apa saja, jawabannya langsung muncul.</p>
        <div class="landing-input-row">
            <textarea id="landingInput" rows="1" placeholder="Tanyakan sesuatu pada PrasMenjawab..."></textarea>
            <button class="send-btn" id="landingSend" title="Kirim">➤</button>
        </div>
        <div class="chips" id="chips"></div>
        <div class="landing-footer">Ditenagai Google Gemini</div>
    </div>

    <div id="chatView">
        <div class="topbar">
            <div class="brand">
                <img src="/static/logo.jpg" alt="Logo" />
                <span>PrasMenjawab</span>
            </div>
            <div class="top-actions">
                <button class="icon-btn danger" id="deleteBtn" title="Hapus percakapan ini">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
            </div>
        </div>
        <div id="chat"></div>
        <div class="chat-input-row">
            <div class="landing-input-row">
                <textarea id="input" rows="1" placeholder="Ketik pertanyaan kamu di sini..."></textarea>
                <button class="send-btn" id="send" title="Kirim">➤</button>
            </div>
        </div>
    </div>

    <script>
        const landingEl = document.getElementById("landing");
        const chatViewEl = document.getElementById("chatView");
        const chatEl = document.getElementById("chat");
        const landingInputEl = document.getElementById("landingInput");
        const inputEl = document.getElementById("input");
        const sendBtn = document.getElementById("send");
        const landingSendBtn = document.getElementById("landingSend");
        const deleteBtn = document.getElementById("deleteBtn");
        const historyToggle = document.getElementById("historyToggle");
        const backdrop = document.getElementById("backdrop");
        const sidebar = document.getElementById("sidebar");
        const sidebarList = document.getElementById("sidebarList");
        const newChatBtn = document.getElementById("newChatBtn");
        const chipsEl = document.getElementById("chips");

        const STORAGE_KEY = "prasmenjawab_conversations_v1";
        const SUGGESTIONS = [
            "Apa itu Python?",
            "Buatkan contoh program Python sederhana",
            "Apa itu API dan cara kerjanya?",
            "Tips belajar coding untuk pemula",
            "Jelaskan perbedaan HTML dan CSS",
        ];

        let conversations = load();
        let currentId = null;

        function load() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
            catch (_) { return []; }
        }
        function save() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations)); } catch (_) {}
        }
        function currentConv() {
            return conversations.find(c => c.id === currentId) || null;
        }
        function newConversation() {
            const c = {
                id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
                title: "",
                createdAt: Date.now(),
                updatedAt: Date.now(),
                messages: [],
            };
            conversations.unshift(c);
            save();
            currentId = c.id;
            return c;
        }

        function buildChips() {
            SUGGESTIONS.forEach((q) => {
                const chip = document.createElement("button");
                chip.className = "chip";
                chip.textContent = q;
                chip.addEventListener("click", () => send(q));
                chipsEl.appendChild(chip);
            });
        }

        function timeNow() {
            const d = new Date();
            return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
        }
        function fmtTime(ts) {
            const d = new Date(ts), now = new Date();
            const pad = n => String(n).padStart(2, "0");
            if (d.toDateString() === now.toDateString())
                return "Hari ini, " + pad(d.getHours()) + ":" + pad(d.getMinutes());
            const yest = new Date(now);
            yest.setDate(now.getDate() - 1);
            if (d.toDateString() === yest.toDateString()) return "Kemarin";
            return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear();
        }

        function switchToChat() {
            landingEl.classList.add("hidden");
            chatViewEl.classList.add("active");
        }
        function resetToLanding() {
            chatEl.innerHTML = "";
            chatViewEl.classList.remove("active");
            landingEl.classList.remove("hidden");
            landingInputEl.value = "";
            inputEl.style.height = "auto";
            landingInputEl.focus();
        }

        function escapeHtml(s) {
            return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }
        function renderMarkdown(src) {
            const blocks = [];
            let text = escapeHtml(src);
            text = text.replace(/```([\s\S]*?)```/g, (m, code) => {
                blocks.push(code.replace(/^\n/, "").replace(/\n$/, ""));
                return "\u0000CB" + (blocks.length - 1) + "\u0000";
            });
            text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
            text = text.replace(/`([^`\n]+)`/g, "<code>$1</code>");
            text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
            text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
            text = text.replace(/^### (.*)$/gm, "<h3>$1</h3>");
            text = text.replace(/^## (.*)$/gm, "<h2>$1</h2>");
            text = text.replace(/^# (.*)$/gm, "<h1>$1</h1>");
            text = text.replace(/(?:(?:^\s*(?:[-*]|\d+\.)\s+.*(?:\n|$))+)/gm, (m) => {
                const items = m.split("\n").map(l => l.replace(/^\s*(?:[-*]|\d+\.)\s+/, "")).filter(Boolean);
                return "<ul>" + items.map(i => "<li>" + i + "</li>").join("") + "</ul>";
            });
            text = text.replace(/\n/g, "<br>");
            text = text.replace(/\u0000CB(\d+)\u0000/g, (m, i) =>
                "<pre><code>" + blocks[+i] + "</code></pre>");
            return text;
        }

        function addMsg(text, role, markdown) {
            const row = document.createElement("div");
            row.className = "msg-row " + role;

            let avatar;
            if (role === "user") {
                avatar = document.createElement("div");
                avatar.className = "msg-avatar user";
                avatar.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
            } else {
                avatar = document.createElement("img");
                avatar.className = "msg-avatar";
                avatar.src = "/static/logo.jpg";
                avatar.alt = "PrasMenjawab";
            }

            const body = document.createElement("div");
            body.className = "msg-body";
            const meta = document.createElement("div");
            meta.className = "msg-meta";
            meta.textContent = (role === "user" ? "Kamu" : "PrasMenjawab") + " · " + timeNow();
            const bubble = document.createElement("div");
            bubble.className = "bubble";
            if (markdown) {
                bubble.innerHTML = renderMarkdown(text);
                decorateCodeBlocks(bubble);
            } else {
                bubble.textContent = text;
            }
            body.appendChild(meta);
            body.appendChild(bubble);

            row.appendChild(avatar);
            row.appendChild(body);
            chatEl.appendChild(row);
            chatEl.scrollTop = chatEl.scrollHeight;
            return bubble;
        }

        function decorateCodeBlocks(scope) {
            scope.querySelectorAll("pre").forEach((pre) => {
                if (pre.querySelector(".code-bar")) return;
                const codeEl = pre.querySelector("code");
                const text = codeEl ? codeEl.textContent : "";
                const bar = document.createElement("div");
                bar.className = "code-bar";
                const label = document.createElement("span");
                label.textContent = "Kode";
                const btn = document.createElement("button");
                btn.className = "copy-btn";
                btn.textContent = "Salin";
                btn.addEventListener("click", () => {
                    navigator.clipboard.writeText(text).then(() => {
                        btn.textContent = "Tersalin ✓";
                        setTimeout(() => { btn.textContent = "Salin"; }, 1500);
                    }).catch(() => {});
                });
                bar.appendChild(label);
                bar.appendChild(btn);
                pre.prepend(bar);
            });
        }

        function parseSSE(body, onDelta) {
            const reader = body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            return (async () => {
                for (;;) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n\n");
                    buffer = lines.pop();
                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            const data = line.slice(6).trim();
                            if (data === "[DONE]") continue;
                            try { onDelta(JSON.parse(data)); } catch (_) {}
                        }
                    }
                }
            })();
        }

        function autosize(el) {
            el.style.height = "auto";
            el.style.height = Math.min(el.scrollHeight, 120) + "px";
        }

        function getPrompt(arg) {
            if (typeof arg === "string") return arg;
            const el = arg || inputEl;
            return el.value;
        }

        async function send(arg) {
            const prompt = getPrompt(arg).trim();
            if (!prompt) return;

            let conv = currentConv();
            if (!conv) conv = newConversation();
            if (!conv.title) {
                conv.title = prompt.length > 40 ? prompt.slice(0, 40) + "…" : prompt;
            }
            conv.messages.push({ role: "user", text: prompt, time: timeNow() });
            conv.updatedAt = Date.now();
            save();
            renderSidebar();

            switchToChat();
            inputEl.value = "";
            landingInputEl.value = "";
            inputEl.style.height = "auto";
            addMsg(prompt, "user");

            const botEl = addMsg("", "bot cursor", true);
            let full = "";
            let ok = false;
            let framePending = false;
            const applyFrame = () => {
                framePending = false;
                botEl.innerHTML = renderMarkdown(full);
                decorateCodeBlocks(botEl);
                botEl.classList.add("cursor");
                chatEl.scrollTop = chatEl.scrollHeight;
            };
            const update = (delta) => {
                full += delta;
                if (!framePending) {
                    framePending = true;
                    requestAnimationFrame(applyFrame);
                }
            };

            sendBtn.disabled = true;
            landingSendBtn.disabled = true;

            try {
                const history = conv.messages.slice(0, -1).map(m => ({ role: m.role, text: m.text }));
                const res = await fetch("/api/chat/stream", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt, history }),
                });
                if (!res.ok) throw new Error("Server error: " + res.status);
                await parseSSE(res.body, (data) => {
                    if (data.error) throw new Error(data.error);
                    if (data.delta) update(data.delta);
                });
                ok = true;
                botEl.classList.remove("cursor");
            } catch (err) {
                botEl.classList.remove("cursor");
                if (full === "") {
                    botEl.parentElement.className = "msg-row error";
                    botEl.textContent = "Terjadi kesalahan: " + err.message;
                }
            } finally {
                if (ok) {
                    conv.messages.push({ role: "model", text: full, time: timeNow() });
                    conv.updatedAt = Date.now();
                    conversations = conversations.filter(c => c.id !== conv.id);
                    conversations.unshift(conv);
                    save();
                    renderSidebar();
                }
                sendBtn.disabled = false;
                landingSendBtn.disabled = false;
                inputEl.focus();
            }
        }

        function openConversation(id) {
            const c = conversations.find(x => x.id === id);
            if (!c) return;
            currentId = id;
            chatEl.innerHTML = "";
            (c.messages || []).forEach(m => {
                if (m.role === "model") addMsg(m.text, "bot", true);
                else addMsg(m.text, "user");
            });
            renderSidebar();
            switchToChat();
            closeSidebar();
        }

        function deleteConversation(id) {
            conversations = conversations.filter(c => c.id !== id);
            save();
            if (currentId === id) {
                currentId = null;
                resetToLanding();
            }
            renderSidebar();
        }

        function renderSidebar() {
            sidebarList.innerHTML = "";
            if (!conversations.length) {
                const empty = document.createElement("div");
                empty.className = "sidebar-empty";
                empty.textContent = "Belum ada percakapan. Mulai tanya PrasMenjawab sekarang!";
                sidebarList.appendChild(empty);
                return;
            }
            conversations.forEach((c) => {
                const item = document.createElement("div");
                item.className = "conv-item" + (c.id === currentId ? " active" : "");

                const main = document.createElement("div");
                main.className = "conv-main";
                const title = document.createElement("div");
                title.className = "conv-title";
                title.textContent = c.title || "Percakapan baru";
                const meta = document.createElement("div");
                meta.className = "conv-meta";
                meta.textContent = fmtTime(c.updatedAt);
                main.appendChild(title);
                main.appendChild(meta);

                const del = document.createElement("button");
                del.className = "conv-del";
                del.title = "Hapus";
                del.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
                del.addEventListener("click", (e) => {
                    e.stopPropagation();
                    deleteConversation(c.id);
                });

                item.addEventListener("click", () => openConversation(c.id));
                item.appendChild(main);
                item.appendChild(del);
                sidebarList.appendChild(item);
            });
        }

        function openSidebar() {
            renderSidebar();
            sidebar.classList.add("open");
            backdrop.classList.add("show");
        }
        function closeSidebar() {
            sidebar.classList.remove("open");
            backdrop.classList.remove("show");
        }

        sendBtn.addEventListener("click", () => send(inputEl.value));
        landingSendBtn.addEventListener("click", () => send(landingInputEl.value));
        deleteBtn.addEventListener("click", () => {
            const c = currentConv();
            if (c && confirm("Hapus percakapan ini?")) deleteConversation(c.id);
        });
        historyToggle.addEventListener("click", openSidebar);
        backdrop.addEventListener("click", closeSidebar);
        newChatBtn.addEventListener("click", () => {
            newConversation();
            resetToLanding();
            renderSidebar();
            closeSidebar();
        });

        [inputEl, landingInputEl].forEach(el => {
            el.addEventListener("input", () => autosize(el));
            el.addEventListener("keydown", (e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    send(el.value);
                }
            });
        });

        buildChips();
        landingInputEl.focus();

        /* Auto-refresh: reload otomatis saat kode di server berubah */
        let siteVersion = null;
        async function checkVersion() {
            try {
                const r = await fetch("/api/version", { cache: "no-store" });
                const d = await r.json();
                if (siteVersion === null) siteVersion = d.version;
                else if (d.version !== siteVersion) location.reload();
            } catch (_) {}
        }
        setInterval(checkVersion, 3000);
    </script>
</body>
</html>
