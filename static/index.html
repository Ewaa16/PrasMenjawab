<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrasMenjawab</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 16px 24px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { font-size: 18px; margin: 0; }
        .toggle label { font-size: 13px; cursor: pointer; }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
            font-size: 14px;
        }
        .msg.user { align-self: flex-end; background: #2563eb; }
        .msg.bot { align-self: flex-start; background: #334155; }
        .msg.error { align-self: flex-start; background: #7f1d1d; }
        .cursor::after { content: "▋"; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        footer {
            padding: 16px 24px;
            background: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            gap: 12px;
        }
        textarea {
            flex: 1;
            resize: none;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            padding: 12px;
            font-size: 14px;
            font-family: inherit;
        }
        button {
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: #fff;
            padding: 0 24px;
            font-size: 14px;
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .hint { font-size: 12px; color: #94a3b8; padding: 0 24px 8px; }
    </style>
</head>
<body>
    <header>
        <h1>PrasMenjawab</h1>
        <div class="toggle">
            <label><input type="checkbox" id="streamToggle" checked /> Streaming</label>
        </div>
    </header>

    <div id="chat"></div>
    <div class="hint" id="hint"></div>

    <footer>
        <textarea id="input" rows="2" placeholder="Ketik pertanyaan kamu di sini..."></textarea>
        <button id="send">Kirim</button>
    </footer>

    <script>
        const chatEl = document.getElementById("chat");
        const inputEl = document.getElementById("input");
        const sendBtn = document.getElementById("send");
        const streamToggle = document.getElementById("streamToggle");
        const hintEl = document.getElementById("hint");

        function addMsg(text, role) {
            const div = document.createElement("div");
            div.className = "msg " + role;
            div.textContent = text;
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
            return div;
        }

        function parseSSE(body, onDelta) {
            const reader = body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            return (async () => {
                for (;;) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n\n");
                    buffer = lines.pop();
                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            const data = line.slice(6).trim();
                            if (data === "[DONE]") continue;
                            try {
                                const parsed = JSON.parse(data);
                                onDelta(parsed);
                            } catch (_) {}
                        }
                    }
                }
            })();
        }

        let sessionId = null;

        async function send() {
            const prompt = inputEl.value.trim();
            if (!prompt) return;

            inputEl.value = "";
            addMsg(prompt, "user");

            const useStream = streamToggle.checked;
            const botEl = addMsg("", "bot cursor");
            let full = "";
            const update = (delta) => {
                full += delta;
                botEl.textContent = full;
                botEl.classList.add("cursor");
                chatEl.scrollTop = chatEl.scrollHeight;
            };

            sendBtn.disabled = true;
            hintEl.textContent = "Menunggu jawaban...";

            try {
                if (useStream) {
                    const res = await fetch("/api/chat/stream", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ prompt, session_id: sessionId }),
                    });
                    if (!res.ok) throw new Error("Server error: " + res.status);
                    await parseSSE(res.body, (data) => {
                        if (data.error) throw new Error(data.error);
                        if (data.delta) update(data.delta);
                        if (data.session_id) sessionId = data.session_id;
                    });
                } else {
                    const res = await fetch("/api/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ prompt, session_id: sessionId }),
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || "Server error");
                    update(data.response);
                    if (data.session_id) sessionId = data.session_id;
                }
                botEl.classList.remove("cursor");
                hintEl.textContent = "";
            } catch (err) {
                botEl.classList.remove("cursor");
                botEl.textContent = full || "";
                if (botEl.textContent === "") {
                    botEl.classList.remove("bot");
                    botEl.classList.add("error");
                    botEl.textContent = "Terjadi kesalahan: " + err.message;
                }
                hintEl.textContent = "";
            } finally {
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        sendBtn.addEventListener("click", send);
        inputEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });
    </script>
</body>
</html>
