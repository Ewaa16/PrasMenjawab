<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrasMenjawab - Asisten Belajar</title>
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #070b14;
            color: #e6eaf2;
            overflow: hidden;
        }

        /* ---------- Landing ---------- */
        #landing {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            background:
                linear-gradient(180deg, rgba(7,11,20,.45) 0%, rgba(7,11,20,.78) 60%, rgba(7,11,20,.96) 100%),
                url("/static/bg.jpg") center/cover no-repeat;
            z-index: 2;
            transition: opacity .35s ease, transform .35s ease;
        }
        #landing.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.03);
        }
        .brand-logo {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 8px 32px rgba(0,0,0,.55), 0 0 0 3px rgba(255,255,255,.08);
            margin-bottom: 18px;
        }
        #landing h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -.5px;
            background: linear-gradient(90deg, #818cf8, #22d3ee);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tagline {
            margin-top: 8px;
            color: #a5b0c6;
            font-size: 15px;
            max-width: 440px;
        }
        .landing-input-row {
            margin-top: 30px;
            width: 100%;
            max-width: 640px;
            display: flex;
            gap: 10px;
            background: rgba(20, 28, 48, .72);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 999px;
            padding: 6px 6px 6px 22px;
            backdrop-filter: blur(14px);
            box-shadow: 0 12px 40px rgba(0,0,0,.45);
            transition: border-color .2s ease;
        }
        .landing-input-row:focus-within { border-color: rgba(129,140,248,.7); }
        .landing-input-row textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e6eaf2;
            font-size: 16px;
            font-family: inherit;
            resize: none;
            padding: 12px 0;
            max-height: 120px;
            line-height: 1.4;
        }
        .landing-input-row textarea::placeholder { color: #7d89a5; }
        .send-btn {
            width: 46px;
            height: 46px;
            flex: 0 0 46px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #22d3ee);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .15s ease, filter .15s ease;
        }
        .send-btn:hover { filter: brightness(1.12); transform: scale(1.04); }
        .send-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

        .chips {
            margin-top: 22px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 640px;
        }
        .chip {
            background: rgba(20, 28, 48, .66);
            border: 1px solid rgba(255,255,255,.14);
            color: #cdd6e8;
            border-radius: 999px;
            padding: 9px 16px;
            font-size: 13.5px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background .15s ease, border-color .15s ease, transform .1s ease;
        }
        .chip:hover {
            background: rgba(99, 102, 241, .28);
            border-color: rgba(129,140,248,.6);
            transform: translateY(-1px);
        }
        .landing-footer {
            position: absolute;
            bottom: 22px;
            font-size: 12px;
            color: #5f6b85;
        }

        /* ---------- Chat ---------- */
        #chatView {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #070b14;
            opacity: 0;
            pointer-events: none;
            transition: opacity .35s ease;
        }
        #chatView.active { opacity: 1; pointer-events: auto; }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(10, 15, 28, .9);
            border-bottom: 1px solid rgba(255,255,255,.07);
            backdrop-filter: blur(10px);
            flex: 0 0 auto;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .brand img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }
        .brand span {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .clear-btn {
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.12);
            color: #cdd6e8;
            border-radius: 999px;
            padding: 7px 14px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s ease, color .15s ease;
        }
        .clear-btn:hover { background: rgba(239,68,68,.18); color: #fca5a5; border-color: rgba(239,68,68,.4); }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }
        .msg-row { display: flex; gap: 12px; max-width: 820px; width: 100%; margin: 0 auto; }
        .msg-row.user { flex-direction: row-reverse; margin-left: auto; justify-content: flex-end; }
        .msg-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            flex: 0 0 34px;
            margin-top: 2px;
        }
        .msg-avatar.user {
            background: linear-gradient(135deg, #6366f1, #22d3ee);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .msg-body { display: flex; flex-direction: column; min-width: 0; }
        .msg-row.user .msg-body { align-items: flex-end; }
        .msg-meta {
            font-size: 11.5px;
            color: #6b7694;
            margin-bottom: 4px;
            padding: 0 4px;
        }
        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14.5px;
            line-height: 1.6;
            word-break: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }
        .msg-row.bot .bubble {
            background: rgba(23, 32, 55, .85);
            border: 1px solid rgba(255,255,255,.07);
            border-top-left-radius: 4px;
        }
        .msg-row.user .bubble {
            background: linear-gradient(135deg, #4f46e5, #0891b2);
            border-top-right-radius: 4px;
        }
        .msg-row.error .bubble {
            background: rgba(127, 29, 29, .55);
            border: 1px solid rgba(239,68,68,.35);
        }
        .cursor::after {
            content: "▋";
            color: #818cf8;
            animation: blink 1s steps(2) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* markdown */
        .bubble h1, .bubble h2, .bubble h3 { margin: 10px 0 6px; line-height: 1.3; }
        .bubble h1 { font-size: 19px; } .bubble h2 { font-size: 17px; } .bubble h3 { font-size: 15.5px; }
        .bubble p { margin: 6px 0; }
        .bubble ul, .bubble ol { margin: 6px 0; padding-left: 22px; }
        .bubble li { margin: 3px 0; }
        .bubble code {
            background: rgba(255,255,255,.1);
            border-radius: 5px;
            padding: 2px 6px;
            font-family: "Cascadia Code", Consolas, monospace;
            font-size: 13px;
        }
        .bubble pre {
            background: #0b1120;
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 10px;
            padding: 12px 14px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .bubble pre code { background: transparent; padding: 0; font-size: 13px; display: block; white-space: pre; }
        .bubble a { color: #7dd3fc; }

        .chat-input-row {
            flex: 0 0 auto;
            padding: 12px 16px 18px;
            display: flex;
            justify-content: center;
        }
        .chat-input-row .landing-input-row { margin-top: 0; }

        .hidden { display: none !important; }

        /* ---------- Responsive ---------- */
        @media (max-width: 600px) {
            #landing h1 { font-size: 27px; }
            .brand-logo { width: 72px; height: 72px; }
            .landing-input-row { max-width: 100%; padding-left: 16px; }
            .bubble { font-size: 14px; }
            #chat { padding: 16px 10px 14px; }
            .topbar { padding: 10px 12px; }
        }
    </style>
</head>
<body>

    <div id="landing">
        <img class="brand-logo" src="/static/logo.jpg" alt="Logo PrasMenjawab" />
        <h1>PrasMenjawab</h1>
        <p class="tagline">Asisten AI untuk belajar coding. Tanya apa saja, jawabannya langsung muncul.</p>
        <div class="landing-input-row">
            <textarea id="landingInput" rows="1" placeholder="Tanyakan sesuatu pada PrasMenjawab..."></textarea>
            <button class="send-btn" id="landingSend" title="Kirim">➤</button>
        </div>
        <div class="chips" id="chips"></div>
        <div class="landing-footer">Ditenagai Google Gemini</div>
    </div>

    <div id="chatView">
        <div class="topbar">
            <div class="brand">
                <img src="/static/logo.jpg" alt="Logo" />
                <span>PrasMenjawab</span>
            </div>
            <button class="clear-btn" id="clearBtn">🗑 Hapus percakapan</button>
        </div>
        <div id="chat"></div>
        <div class="chat-input-row">
            <div class="landing-input-row">
                <textarea id="input" rows="1" placeholder="Ketik pertanyaan kamu di sini..."></textarea>
                <button class="send-btn" id="send" title="Kirim">➤</button>
            </div>
        </div>
    </div>

    <script>
        const landingEl = document.getElementById("landing");
        const chatViewEl = document.getElementById("chatView");
        const chatEl = document.getElementById("chat");
        const landingInputEl = document.getElementById("landingInput");
        const inputEl = document.getElementById("input");
        const sendBtn = document.getElementById("send");
        const landingSendBtn = document.getElementById("landingSend");
        const clearBtn = document.getElementById("clearBtn");
        const chipsEl = document.getElementById("chips");

        let sessionId = null;

        const SUGGESTIONS = [
            "Apa itu Python?",
            "Buatkan contoh program Python sederhana",
            "Apa itu API dan cara kerjanya?",
            "Tips belajar coding untuk pemula",
            "Jelaskan perbedaan HTML dan CSS",
        ];

        function buildChips() {
            SUGGESTIONS.forEach((q) => {
                const chip = document.createElement("button");
                chip.className = "chip";
                chip.textContent = q;
                chip.addEventListener("click", () => send(q));
                chipsEl.appendChild(chip);
            });
        }

        function timeNow() {
            const d = new Date();
            return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
        }

        function switchToChat() {
            landingEl.classList.add("hidden");
            chatViewEl.classList.add("active");
        }

        function resetToLanding() {
            chatEl.innerHTML = "";
            sessionId = null;
            chatViewEl.classList.remove("active");
            landingEl.classList.remove("hidden");
            landingInputEl.value = "";
            landingInputEl.focus();
        }

        function escapeHtml(s) {
            return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        function renderMarkdown(src) {
            const blocks = [];
            let text = escapeHtml(src);
            text = text.replace(/```([\s\S]*?)```/g, (m, code) => {
                blocks.push(code.replace(/^\n/, "").replace(/\n$/, ""));
                return "\u0000CB" + (blocks.length - 1) + "\u0000";
            });
            text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
            text = text.replace(/`([^`\n]+)`/g, "<code>$1</code>");
            text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
            text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
            text = text.replace(/^### (.*)$/gm, "<h3>$1</h3>");
            text = text.replace(/^## (.*)$/gm, "<h2>$1</h2>");
            text = text.replace(/^# (.*)$/gm, "<h1>$1</h1>");
            text = text.replace(/(?:(?:^\s*(?:[-*]|\d+\.)\s+.*(?:\n|$))+)/gm, (m) => {
                const items = m.split("\n").map(l => l.replace(/^\s*(?:[-*]|\d+\.)\s+/, "")).filter(Boolean);
                return "<ul>" + items.map(i => "<li>" + i + "</li>").join("") + "</ul>";
            });
            text = text.replace(/\n/g, "<br>");
            text = text.replace(/\u0000CB(\d+)\u0000/g, (m, i) =>
                "<pre><code>" + blocks[+i] + "</code></pre>");
            return text;
        }

        function addMsg(text, role, html) {
            const row = document.createElement("div");
            row.className = "msg-row " + role;

            let avatar;
            if (role === "user") {
                avatar = document.createElement("div");
                avatar.className = "msg-avatar user";
                avatar.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
            } else {
                avatar = document.createElement("img");
                avatar.className = "msg-avatar";
                avatar.src = "/static/logo.jpg";
                avatar.alt = "PrasMenjawab";
            }

            const body = document.createElement("div");
            body.className = "msg-body";
            const meta = document.createElement("div");
            meta.className = "msg-meta";
            meta.textContent = (role === "user" ? "Kamu" : "PrasMenjawab") + " · " + timeNow();
            const bubble = document.createElement("div");
            bubble.className = "bubble";
            if (html) bubble.innerHTML = text;
            else bubble.textContent = text;
            body.appendChild(meta);
            body.appendChild(bubble);

            row.appendChild(avatar);
            row.appendChild(body);
            chatEl.appendChild(row);
            chatEl.scrollTop = chatEl.scrollHeight;
            return bubble;
        }

        function parseSSE(body, onDelta) {
            const reader = body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            return (async () => {
                for (;;) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n\n");
                    buffer = lines.pop();
                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            const data = line.slice(6).trim();
                            if (data === "[DONE]") continue;
                            try {
                                onDelta(JSON.parse(data));
                            } catch (_) {}
                        }
                    }
                }
            })();
        }

        function autosize(el) {
            el.style.height = "auto";
            el.style.height = Math.min(el.scrollHeight, 120) + "px";
        }
        [inputEl, landingInputEl].forEach(el => {
            el.addEventListener("input", () => autosize(el));
            el.addEventListener("keydown", (e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    send(el === landingInputEl ? null : el);
                }
            });
        });

        async function send(forceValue) {
            const prompt = (forceValue != null ? String(forceValue) : inputEl.value).trim();
            if (!prompt) return;

            switchToChat();
            inputEl.value = "";
            landingInputEl.value = "";
            inputEl.style.height = "auto";
            addMsg(prompt, "user");

            const botEl = addMsg("", "bot cursor", true);
            let full = "";
            const update = (delta) => {
                full += delta;
                botEl.innerHTML = renderMarkdown(full);
                botEl.classList.add("cursor");
                chatEl.scrollTop = chatEl.scrollHeight;
            };

            sendBtn.disabled = true;
            landingSendBtn.disabled = true;

            try {
                const res = await fetch("/api/chat/stream", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt, session_id: sessionId }),
                });
                if (!res.ok) throw new Error("Server error: " + res.status);
                await parseSSE(res.body, (data) => {
                    if (data.error) throw new Error(data.error);
                    if (data.delta) update(data.delta);
                    if (data.session_id) sessionId = data.session_id;
                });
                botEl.classList.remove("cursor");
            } catch (err) {
                botEl.classList.remove("cursor");
                if (full === "") {
                    botEl.parentElement.className = "msg-row error";
                    botEl.textContent = "Terjadi kesalahan: " + err.message;
                }
            } finally {
                sendBtn.disabled = false;
                landingSendBtn.disabled = false;
                inputEl.focus();
            }
        }

        sendBtn.addEventListener("click", () => send());
        landingSendBtn.addEventListener("click", () => send(landingInputEl.value));

        clearBtn.addEventListener("click", () => {
            if (confirm("Hapus semua percakapan ini?")) resetToLanding();
        });

        buildChips();
        landingInputEl.focus();

        /* Auto-refresh: reload otomatis saat kode di server berubah */
        let siteVersion = null;
        async function checkVersion() {
            try {
                const r = await fetch("/api/version", { cache: "no-store" });
                const d = await r.json();
                if (siteVersion === null) siteVersion = d.version;
                else if (d.version !== siteVersion) location.reload();
            } catch (_) {}
        }
        setInterval(checkVersion, 3000);
    </script>
</body>
</html>
