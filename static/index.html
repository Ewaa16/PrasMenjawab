<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrasMenjawab - Asisten Belajar</title>
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #070b14;
            color: #e6eaf2;
            overflow: hidden;
        }

        /* ---------- Landing ---------- */
        #landing {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            background:
                linear-gradient(180deg, rgba(7,11,20,.45) 0%, rgba(7,11,20,.78) 60%, rgba(7,11,20,.96) 100%),
                url("/static/bg.jpg") center/cover no-repeat;
            z-index: 2;
            transition: opacity .35s ease, transform .35s ease;
        }
        #landing.hidden { opacity: 0; pointer-events: none; transform: scale(1.03); }
        .brand-logo { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; box-shadow: 0 8px 32px rgba(0,0,0,.55), 0 0 0 3px rgba(255,255,255,.08); margin-bottom: 18px; }
        #landing h1 { font-size: 34px; font-weight: 700; letter-spacing: -.5px; background: linear-gradient(90deg, #818cf8, #22d3ee); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .tagline { margin-top: 8px; color: #a5b0c6; font-size: 15px; max-width: 440px; }
        .landing-input-row { margin-top: 30px; width: 100%; max-width: 640px; display: flex; gap: 10px; background: rgba(20,28,48,.72); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 6px 6px 6px 22px; backdrop-filter: blur(14px); box-shadow: 0 12px 40px rgba(0,0,0,.45); transition: border-color .2s ease; }
        .landing-input-row:focus-within { border-color: rgba(129,140,248,.7); }
        .landing-input-row textarea { flex: 1; background: transparent; border: none; outline: none; color: #e6eaf2; font-size: 16px; font-family: inherit; resize: none; padding: 12px 0; max-height: 120px; line-height: 1.4; }
        .landing-input-row textarea::placeholder { color: #7d89a5; }
        .send-btn { width: 46px; height: 46px; flex: 0 0 46px; border: none; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #22d3ee); color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .15s ease, filter .15s ease; }
        .send-btn:hover { filter: brightness(1.12); transform: scale(1.04); }
        .send-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
        .chips { margin-top: 22px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 640px; }
        .chip { background: rgba(20,28,48,.66); border: 1px solid rgba(255,255,255,.14); color: #cdd6e8; border-radius: 999px; padding: 9px 16px; font-size: 13.5px; cursor: pointer; backdrop-filter: blur(10px); transition: background .15s ease, border-color .15s ease, transform .1s ease; }
        .chip:hover { background: rgba(99,102,241,.28); border-color: rgba(129,140,248,.6); transform: translateY(-1px); }
        .landing-footer { position: absolute; bottom: 22px; font-size: 12px; color: #5f6b85; }

        /* ---------- Chat ---------- */
        #chatView { display: flex; flex-direction: column; height: 100vh; background: radial-gradient(1200px 500px at 50% -10%, rgba(99,102,241,.12), transparent 60%), #070b14; opacity: 0; pointer-events: none; transition: opacity .35s ease; }
        #chatView.active { opacity: 1; pointer-events: auto; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; background: rgba(10,15,28,.9); border-bottom: 1px solid rgba(255,255,255,.07); backdrop-filter: blur(10px); flex: 0 0 auto; }
        .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .brand img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .brand span { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .top-actions { display: flex; gap: 8px; align-items: center; }
        .doc-badge { background: rgba(99,102,241,.25); border: 1px solid rgba(129,140,248,.35); border-radius: 999px; padding: 4px 10px; font-size: 11.5px; color: #a5b4fc; white-space: nowrap; }
        .icon-btn { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: #cdd6e8; border-radius: 10px; width: 38px; height: 38px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s ease, color .15s ease; }
        .icon-btn:hover { background: rgba(255,255,255,.12); }
        .icon-btn.danger:hover { background: rgba(239,68,68,.18); color: #fca5a5; border-color: rgba(239,68,68,.4); }
        .icon-btn:disabled { opacity: .4; cursor: not-allowed; }
        .history-toggle { position: fixed; top: 14px; left: 14px; z-index: 50; background: rgba(20,28,48,.72); border: 1px solid rgba(255,255,255,.14); color: #cdd6e8; border-radius: 12px; width: 42px; height: 42px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); transition: background .15s ease; }
        .history-toggle:hover { background: rgba(99,102,241,.28); }

        /* ---------- Sidebar ---------- */
        .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
        .backdrop.show { opacity: 1; pointer-events: auto; }
        #sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 300px; max-width: 85vw; background: #0c1220; border-right: 1px solid rgba(255,255,255,.08); z-index: 70; transform: translateX(-100%); transition: transform .28s ease; display: flex; flex-direction: column; box-shadow: 8px 0 32px rgba(0,0,0,.4); }
        #sidebar.open { transform: translateX(0); }
        .sidebar-head { padding: 18px 16px 12px; display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; }
        .sidebar-head h2 { font-size: 16px; font-weight: 600; }
        .new-chat-btn { background: linear-gradient(135deg, #6366f1, #22d3ee); border: none; color: #fff; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; transition: filter .15s ease, transform .1s ease; }
        .new-chat-btn:hover { filter: brightness(1.12); transform: translateY(-1px); }
        .sidebar-list { flex: 1; overflow-y: auto; padding: 6px 10px 16px; display: flex; flex-direction: column; gap: 4px; }
        .sidebar-list::-webkit-scrollbar { width: 8px; }
        .sidebar-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }
        .sidebar-list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.22); }
        .sidebar-list::-webkit-scrollbar-track { background: transparent; }

        .sidebar-sep { height: 1px; background: rgba(255,255,255,.08); margin: 8px 4px; }
        .sidebar-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: #5f6b85; padding: 8px 12px 4px; }

        /* Doc section */
        .doc-section { margin-bottom: 4px; }
        .doc-header { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px; }
        .doc-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: #5f6b85; }
        .upload-btn { background: rgba(99,102,241,.18); border: 1px solid rgba(129,140,248,.25); color: #a5b4fc; border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; transition: all .12s ease; }
        .upload-btn:hover { background: rgba(99,102,241,.32); border-color: rgba(129,140,248,.5); }
        .upload-btn:disabled { opacity: .5; cursor: not-allowed; }
        .doc-item { display: flex; align-items: center; gap: 8px; padding: 8px 8px; border-radius: 8px; border: 1px solid transparent; transition: background .1s; }
        .doc-item:hover { background: rgba(255,255,255,.04); }
        .doc-item input[type="checkbox"] { appearance: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.2); border-radius: 5px; background: transparent; cursor: pointer; flex: 0 0 18px; transition: all .15s; display: flex; align-items: center; justify-content: center; }
        .doc-item input[type="checkbox"]:checked { background: #6366f1; border-color: #6366f1; }
        .doc-item input[type="checkbox"]:checked::after { content: "✓"; color: #fff; font-size: 12px; font-weight: 700; }
        .doc-info { flex: 1; min-width: 0; }
        .doc-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .doc-meta { font-size: 11px; color: #6b7694; margin-top: 1px; }
        .doc-del { background: transparent; border: none; color: #6b7694; font-size: 16px; width: 24px; height: 24px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: all .12s; flex: 0 0 24px; }
        .doc-item:hover .doc-del { opacity: 1; }
        .doc-del:hover { color: #fca5a5; background: rgba(239,68,68,.18); }
        .doc-empty { padding: 10px 12px; color: #5f6b85; font-size: 12.5px; line-height: 1.5; }

        .conv-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; transition: background .12s ease; }
        .conv-item:hover { background: rgba(255,255,255,.05); }
        .conv-item.active { background: rgba(99,102,241,.18); border-color: rgba(129,140,248,.3); }
        .conv-main { flex: 1; min-width: 0; }
        .conv-title { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-meta { font-size: 11.5px; color: #6b7694; margin-top: 2px; }
        .conv-del { background: transparent; border: none; color: #6b7694; font-size: 16px; width: 28px; height: 28px; border-radius: 8px; cursor: pointer; flex: 0 0 28px; display: flex; align-items: center; justify-content: center; opacity: 0; transition: all .12s ease; }
        .conv-item:hover .conv-del { opacity: 1; }
        .conv-del:hover { color: #fca5a5; background: rgba(239,68,68,.18); }
        .sidebar-empty { padding: 24px 16px; text-align: center; color: #5f6b85; font-size: 13px; line-height: 1.6; }

        /* ---------- Messages ---------- */
        #chat { flex: 1; overflow-y: auto; padding: 24px 16px 20px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        #chat::-webkit-scrollbar { width: 6px; }
        #chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 6px; }
        #chat::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.2); }
        #chat::-webkit-scrollbar-track { background: transparent; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        .msg-row { display: flex; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; animation: msgIn .28s ease both; align-items: flex-start; padding: 0 4px; }
        .msg-row.bot { justify-content: flex-start; }
        .msg-row.user { flex-direction: row-reverse; justify-content: flex-start; }

        .msg-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: 0 0 34px; margin-top: 1px; }
        .msg-avatar.bot-av { box-shadow: 0 0 0 2px rgba(129,140,248,.25), 0 2px 10px rgba(99,102,241,.3); }
        .msg-avatar.user { background: linear-gradient(135deg, #6366f1, #a855f7); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px rgba(168,85,247,.25), 0 2px 10px rgba(99,102,241,.25); }

        .msg-body { display: flex; flex-direction: column; min-width: 0; max-width: 70%; }
        .msg-row.user .msg-body { align-items: flex-end; }
        .msg-row.bot .msg-body { align-items: flex-start; }

        .msg-meta { font-size: 11px; color: #5a6580; margin-bottom: 3px; padding: 0 2px; }
        .bubble { padding: 10px 16px; border-radius: 18px; font-size: 14px; line-height: 1.65; word-break: break-word; overflow-wrap: break-word; max-width: 100%; }
        .msg-row.bot .bubble { background: rgba(26,35,56,.95); border: 1px solid rgba(255,255,255,.07); border-bottom-left-radius: 6px; color: #d8dfe9; }
        .msg-row.user .bubble { background: linear-gradient(135deg, #5b5fc7, #7c3aed); border-bottom-right-radius: 6px; color: #fff; }
        .msg-row.error .bubble { background: rgba(127,29,29,.55); border: 1px solid rgba(239,68,68,.35); color: #fca5a5; }

        .typing { display: inline-flex; align-items: center; gap: 5px; padding: 6px 2px; }
        .typing .dot { width: 7px; height: 7px; border-radius: 50%; background: #818cf8; animation: dotPulse 1.2s infinite ease-in-out; }
        .typing .dot:nth-child(2) { animation-delay: .15s; }
        .typing .dot:nth-child(3) { animation-delay: .3s; }
        @keyframes dotPulse { 0%,60%,100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-5px); opacity: 1; } }

        .bubble h1, .bubble h2, .bubble h3 { margin: 8px 0 5px; line-height: 1.3; }
        .bubble h1 { font-size: 18px; } .bubble h2 { font-size: 16px; } .bubble h3 { font-size: 15px; }
        .bubble p { margin: 4px 0; }
        .bubble ul, .bubble ol { margin: 4px 0; padding-left: 20px; }
        .bubble li { margin: 2px 0; }
        .bubble code { background: rgba(255,255,255,.08); border-radius: 5px; padding: 2px 6px; font-family: "Cascadia Code", Consolas, monospace; font-size: 12.5px; }
        .bubble pre { position: relative; background: #0b1120; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 40px 14px 12px; overflow-x: auto; margin: 6px 0; }
        .bubble pre code { background: transparent; padding: 0; font-size: 12.5px; display: block; white-space: pre; }
        .code-bar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 6px 10px 6px 14px; background: rgba(255,255,255,.04); border-bottom: 1px solid rgba(255,255,255,.07); border-radius: 10px 10px 0 0; font-size: 11.5px; color: #7d89a5; }
        .copy-btn { background: rgba(255,255,255,.07); border: none; color: #cdd6e8; border-radius: 6px; padding: 3px 10px; font-size: 11px; cursor: pointer; transition: background .12s ease; }
        .copy-btn:hover { background: rgba(129,140,248,.3); }
        .bubble a { color: #7dd3fc; }

        .chat-input-row { flex: 0 0 auto; padding: 12px 16px 18px; display: flex; justify-content: center; }
        .chat-input-row .landing-input-row { margin-top: 0; }
        .hidden { display: none !important; }

        @media (min-width: 601px) and (max-width: 1024px) {
            #chat { padding: 20px 20px 18px; }
            .msg-body { max-width: 72%; }
            #sidebar { width: 280px; }
        }
        @media (max-width: 600px) {
            #landing h1 { font-size: 24px; }
            .tagline { font-size: 13px; }
            .brand-logo { width: 64px; height: 64px; }
            .landing-input-row { max-width: 100%; padding: 4px 4px 4px 16px; border-radius: 16px; }
            .landing-input-row textarea { font-size: 15px; padding: 10px 0; }
            .send-btn { width: 40px; height: 40px; flex: 0 0 40px; font-size: 17px; }
            .chips { gap: 8px; }
            .chip { padding: 7px 13px; font-size: 12.5px; }
            .bubble { font-size: 13.5px; padding: 9px 14px; border-radius: 14px; }
            .msg-body { max-width: 80%; }
            .msg-avatar { width: 30px; height: 30px; flex: 0 0 30px; }
            #chat { padding: 14px 10px 12px; gap: 16px; }
            .topbar { padding: 10px 12px; }
            .brand span { font-size: 14px; }
            .history-toggle { top: 10px; left: 10px; width: 38px; height: 38px; }
            #sidebar { width: 260px; }
            .sidebar-head { padding: 14px 14px 10px; }
            .chat-input-row { padding: 8px 10px 14px; }
            .doc-badge { font-size: 10.5px; padding: 3px 8px; }
        }
    </style>
</head>
<body>

    <button class="history-toggle" id="historyToggle" title="Riwayat & Dokumen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#cdd6e8" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <div class="backdrop" id="backdrop"></div>

    <div id="sidebar">
        <div class="sidebar-head">
            <h2>PrasMenjawab</h2>
            <button class="new-chat-btn" id="newChatBtn">+ Baru</button>
        </div>
        <div class="sidebar-list" id="sidebarList"></div>
    </div>

    <input type="file" id="fileInput" accept=".pdf" hidden />

    <div id="landing">
        <img class="brand-logo" src="/static/logo.jpg" alt="Logo PrasMenjawab" />
        <h1>PrasMenjawab</h1>
        <p class="tagline">Asisten AI untuk belajar coding. Tanya apa saja, jawabannya langsung muncul.</p>
        <div class="landing-input-row">
            <textarea id="landingInput" rows="1" placeholder="Tanyakan sesuatu pada PrasMenjawab..."></textarea>
            <button class="send-btn" id="landingSend" title="Kirim">➤</button>
        </div>
        <div class="chips" id="chips"></div>
        <div class="landing-footer">Ditenagai Google Gemini</div>
    </div>

    <div id="chatView">
        <div class="topbar">
            <div class="brand">
                <img src="/static/logo.jpg" alt="Logo" />
                <span>PrasMenjawab</span>
            </div>
            <div class="top-actions">
                <span class="doc-badge" id="docBadge"></span>
                <button class="icon-btn danger" id="deleteBtn" title="Hapus percakapan ini">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
            </div>
        </div>
        <div id="chat"></div>
        <div class="chat-input-row">
            <div class="landing-input-row">
                <textarea id="input" rows="1" placeholder="Ketik pertanyaan kamu di sini..."></textarea>
                <button class="send-btn" id="send" title="Kirim">➤</button>
            </div>
        </div>
    </div>

    <script>
        /* ===== DOM refs ===== */
        const landingEl = document.getElementById("landing");
        const chatViewEl = document.getElementById("chatView");
        const chatEl = document.getElementById("chat");
        const landingInputEl = document.getElementById("landingInput");
        const inputEl = document.getElementById("input");
        const sendBtn = document.getElementById("send");
        const landingSendBtn = document.getElementById("landingSend");
        const deleteBtn = document.getElementById("deleteBtn");
        const historyToggle = document.getElementById("historyToggle");
        const backdrop = document.getElementById("backdrop");
        const sidebar = document.getElementById("sidebar");
        const sidebarList = document.getElementById("sidebarList");
        const newChatBtn = document.getElementById("newChatBtn");
        const chipsEl = document.getElementById("chips");
        const fileInput = document.getElementById("fileInput");
        const docBadge = document.getElementById("docBadge");

        /* ===== Config ===== */
        const STORAGE_KEY = "prasmenjawab_conversations_v1";
        const DOCS_KEY = "prasmenjawab_docs_v1";
        const SUGGESTIONS = [
            "Apa itu Python?",
            "Buatkan contoh program Python sederhana",
            "Apa itu API dan cara kerjanya?",
            "Tips belajar coding untuk pemula",
            "Jelaskan perbedaan HTML dan CSS",
        ];

        /* ===== State ===== */
        let conversations = loadJSON(STORAGE_KEY);
        let currentId = null;
        let documents = loadJSON(DOCS_KEY);
        let selectedDocs = new Set(documents.filter(d => d.selected !== false).map(d => d.id));
        let uploading = false;

        function loadJSON(key) { try { return JSON.parse(localStorage.getItem(key)) || []; } catch (_) { return []; } }
        function saveJSON(key, data) { try { localStorage.setItem(key, JSON.stringify(data)); } catch (_) {} }

        /* ===== Conversation helpers ===== */
        function currentConv() { return conversations.find(c => c.id === currentId) || null; }
        function newConversation() {
            const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2,7), title: "", createdAt: Date.now(), updatedAt: Date.now(), messages: [] };
            conversations.unshift(c);
            saveJSON(STORAGE_KEY, conversations);
            currentId = c.id;
            return c;
        }

        /* ===== Document helpers ===== */
        function deleteDoc(id) {
            documents = documents.filter(d => d.id !== id);
            selectedDocs.delete(id);
            saveJSON(DOCS_KEY, documents);
            renderSidebar();
        }
        function updateDocBadge() {
            const n = [...selectedDocs].length;
            docBadge.textContent = n ? "📄 " + n + " aktif" : "";
            docBadge.style.display = n ? "" : "none";
        }

        /* ===== RAG: embedding + cosine ===== */
        async function embedTexts(texts) {
            const res = await fetch("/api/embed", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ texts }),
            });
            if (!res.ok) throw new Error("Embed error: " + res.status);
            return (await res.json()).embeddings;
        }

        function cosine(a, b) {
            let dot = 0, na = 0, nb = 0;
            for (let i = 0; i < a.length; i++) { dot += a[i]*b[i]; na += a[i]*a[i]; nb += b[i]*b[i]; }
            return dot / (Math.sqrt(na) * Math.sqrt(nb) + 1e-10);
        }

        function topK(qEmb, docs, k) {
            const all = [];
            for (const doc of docs) {
                for (let i = 0; i < doc.chunks.length; i++) {
                    if (doc.embeddings[i]) {
                        all.push({ docName: doc.name, text: doc.chunks[i], score: cosine(qEmb, doc.embeddings[i]) });
                    }
                }
            }
            all.sort((a, b) => b.score - a.score);
            return all.slice(0, k);
        }

        async function uploadPdf(file) {
            if (uploading) return;
            uploading = true;
            renderSidebar();
            try {
                const fd = new FormData();
                fd.append("file", file);
                const upRes = await fetch("/api/upload-pdf", { method: "POST", body: fd });
                if (!upRes.ok) { const e = await upRes.json(); throw new Error(e.detail || "Upload gagal"); }
                const { chunks, name, pages } = await upRes.json();

                const embeddings = [];
                const BATCH = 50;
                for (let i = 0; i < chunks.length; i += BATCH) {
                    const embRes = await embedTexts(chunks.slice(i, i + BATCH));
                    embeddings.push(...embRes);
                }

                const doc = {
                    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
                    name, pages, chunks, embeddings,
                    createdAt: Date.now(),
                    selected: true,
                };
                documents.push(doc);
                selectedDocs.add(doc.id);
                saveJSON(DOCS_KEY, documents);
                updateDocBadge();
                renderSidebar();
            } catch (err) {
                alert("Gagal upload: " + err.message);
            } finally {
                uploading = false;
                renderSidebar();
            }
        }

        fileInput.addEventListener("change", () => {
            const file = fileInput.files[0];
            if (file) uploadPdf(file);
            fileInput.value = "";
        });

        /* ===== UI helpers ===== */
        function buildChips() {
            SUGGESTIONS.forEach(q => {
                const chip = document.createElement("button");
                chip.className = "chip";
                chip.textContent = q;
                chip.addEventListener("click", () => send(q));
                chipsEl.appendChild(chip);
            });
        }

        function timeNow() { const d = new Date(); return d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0"); }
        function fmtTime(ts) {
            const d = new Date(ts), now = new Date();
            const pad = n => String(n).padStart(2,"0");
            if (d.toDateString() === now.toDateString()) return "Hari ini, " + pad(d.getHours()) + ":" + pad(d.getMinutes());
            const y = new Date(now); y.setDate(now.getDate()-1);
            if (d.toDateString() === y.toDateString()) return "Kemarin";
            return pad(d.getDate()) + "/" + pad(d.getMonth()+1) + "/" + d.getFullYear();
        }

        function switchToChat() { landingEl.classList.add("hidden"); chatViewEl.classList.add("active"); }
        function resetToLanding() { chatEl.innerHTML = ""; chatViewEl.classList.remove("active"); landingEl.classList.remove("hidden"); landingInputEl.value = ""; inputEl.style.height = "auto"; landingInputEl.focus(); }

        /* ===== Markdown ===== */
        function escapeHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
        function renderMarkdown(src) {
            const blocks = [];
            let text = escapeHtml(src);
            text = text.replace(/```([\s\S]*?)```/g, (m, code) => { blocks.push(code.replace(/^\n/,"").replace(/\n$/,"")); return "\u0000CB"+(blocks.length-1)+"\u0000"; });
            text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
            text = text.replace(/`([^`\n]+)`/g, "<code>$1</code>");
            text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
            text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
            text = text.replace(/^### (.*)$/gm, "<h3>$1</h3>");
            text = text.replace(/^## (.*)$/gm, "<h2>$1</h2>");
            text = text.replace(/^# (.*)$/gm, "<h1>$1</h1>");
            text = text.replace(/(?:(?:^\s*(?:[-*]|\d+\.)\s+.*(?:\n|$))+)/gm, (m) => { const items = m.split("\n").map(l => l.replace(/^\s*(?:[-*]|\d+\.)\s+/,"")).filter(Boolean); return "<ul>"+items.map(i => "<li>"+i+"</li>").join("")+"</ul>"; });
            text = text.replace(/\n/g, "<br>");
            text = text.replace(/\u0000CB(\d+)\u0000/g, (m,i) => "<pre><code>"+blocks[+i]+"</code></pre>");
            return text;
        }
        function typingDots() { return '<span class="typing" aria-label="Mengetik"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>'; }
        function addMsg(text, role, markdown) {
            const row = document.createElement("div"); row.className = "msg-row " + role;
            let avatar;
            if (role === "user") { avatar = document.createElement("div"); avatar.className = "msg-avatar user"; avatar.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
            } else { avatar = document.createElement("img"); avatar.className = "msg-avatar bot-av"; avatar.src = "/static/logo.jpg"; avatar.alt = "PrasMenjawab"; }
            const body = document.createElement("div"); body.className = "msg-body";
            const meta = document.createElement("div"); meta.className = "msg-meta"; meta.textContent = (role==="user"?"Kamu":"PrasMenjawab")+" · "+timeNow();
            const bubble = document.createElement("div"); bubble.className = "bubble";
            if (markdown) { bubble.innerHTML = renderMarkdown(text); decorateCodeBlocks(bubble); } else { bubble.textContent = text; }
            body.appendChild(meta); body.appendChild(bubble); row.appendChild(avatar); row.appendChild(body);
            chatEl.appendChild(row); chatEl.scrollTop = chatEl.scrollHeight;
            return bubble;
        }
        function decorateCodeBlocks(scope) {
            scope.querySelectorAll("pre").forEach(pre => {
                if (pre.querySelector(".code-bar")) return;
                const codeEl = pre.querySelector("code"); const text = codeEl ? codeEl.textContent : "";
                const bar = document.createElement("div"); bar.className = "code-bar";
                const label = document.createElement("span"); label.textContent = "Kode";
                const btn = document.createElement("button"); btn.className = "copy-btn"; btn.textContent = "Salin";
                btn.addEventListener("click", () => { navigator.clipboard.writeText(text).then(() => { btn.textContent = "Tersalin ✓"; setTimeout(() => { btn.textContent = "Salin"; }, 1500); }); });
                bar.appendChild(label); bar.appendChild(btn); pre.prepend(bar);
            });
        }
        function parseSSE(body, onDelta) {
            const reader = body.getReader(); const decoder = new TextDecoder(); let buffer = "";
            return (async () => { for (;;) { const { done, value } = await reader.read(); if (done) break; buffer += decoder.decode(value, { stream: true }); const lines = buffer.split("\n\n"); buffer = lines.pop(); for (const line of lines) { if (line.startsWith("data: ")) { const data = line.slice(6).trim(); if (data === "[DONE]") continue; try { onDelta(JSON.parse(data)); } catch (_) {} } } } })();
        }
        function autosize(el) { el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 120) + "px"; }
        function getPrompt(arg) { if (typeof arg === "string") return arg; return (arg || inputEl).value; }

        /* ===== Send with RAG context ===== */
        async function send(arg) {
            const originalPrompt = getPrompt(arg).trim();
            if (!originalPrompt) return;

            let conv = currentConv();
            if (!conv) conv = newConversation();
            if (!conv.title) conv.title = originalPrompt.length > 40 ? originalPrompt.slice(0,40) + "…" : originalPrompt;
            conv.messages.push({ role: "user", text: originalPrompt, time: timeNow() });
            conv.updatedAt = Date.now();
            saveJSON(STORAGE_KEY, conversations);
            renderSidebar();

            switchToChat();
            inputEl.value = ""; landingInputEl.value = ""; inputEl.style.height = "auto";
            addMsg(originalPrompt, "user");

            /* RAG: build augmented prompt */
            let augmentedPrompt = originalPrompt;
            const activeDocs = documents.filter(d => selectedDocs.has(d.id));
            if (activeDocs.length > 0) {
                try {
                    const qEmb = (await embedTexts([originalPrompt]))[0];
                    const hits = topK(qEmb, activeDocs, 4);
                    if (hits.length > 0 && hits[0].score > 0.3) {
                        const ctx = hits.map(h => `[Dokumen: ${h.docName}]\n${h.text}`).join("\n\n---\n\n");
                        augmentedPrompt = `Gunakan informasi berikut untuk menjawab. Jika tidak relevan, jawab secara umum.\n\n=== DARI DOKUMEN ===\n${ctx}\n=== AKHIR ===\n\nPertanyaan: ${originalPrompt}`;
                    }
                } catch (_) {}
            }

            const botEl = addMsg("", "bot", true); botEl.innerHTML = typingDots();
            let full = ""; let ok = false; let framePending = false;
            const applyFrame = () => { framePending = false; botEl.innerHTML = renderMarkdown(full); decorateCodeBlocks(botEl); chatEl.scrollTop = chatEl.scrollHeight; };
            const update = (delta) => { full += delta; if (!framePending) { framePending = true; requestAnimationFrame(applyFrame); } };

            sendBtn.disabled = true; landingSendBtn.disabled = true;

            try {
                const history = conv.messages.slice(0, -1).map(m => ({ role: m.role, text: m.text }));
                const res = await fetch("/api/chat/stream", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: augmentedPrompt, history }),
                });
                if (!res.ok) throw new Error("Server error: " + res.status);
                await parseSSE(res.body, (data) => { if (data.error) throw new Error(data.error); if (data.delta) update(data.delta); });
                ok = true;
            } catch (err) {
                if (full === "") { botEl.parentElement.className = "msg-row error"; botEl.textContent = "Terjadi kesalahan: " + err.message; }
            } finally {
                if (ok) { conv.messages.push({ role: "model", text: full, time: timeNow() }); conv.updatedAt = Date.now(); conversations = conversations.filter(c => c.id !== conv.id); conversations.unshift(conv); saveJSON(STORAGE_KEY, conversations); renderSidebar(); }
                sendBtn.disabled = false; landingSendBtn.disabled = false; inputEl.focus();
            }
        }

        /* ===== Conversation management ===== */
        function openConversation(id) {
            const c = conversations.find(x => x.id === id); if (!c) return;
            currentId = id; chatEl.innerHTML = "";
            (c.messages||[]).forEach(m => { if (m.role === "model") addMsg(m.text, "bot", true); else addMsg(m.text, "user"); });
            renderSidebar(); switchToChat(); closeSidebar();
        }
        function deleteConversation(id) {
            conversations = conversations.filter(c => c.id !== id); saveJSON(STORAGE_KEY, conversations);
            if (currentId === id) { currentId = null; resetToLanding(); }
            renderSidebar();
        }

        /* ===== Sidebar ===== */
        function renderSidebar() {
            sidebarList.innerHTML = "";

            /* Document section */
            const docSec = document.createElement("div"); docSec.className = "doc-section";
            const docHead = document.createElement("div"); docHead.className = "doc-header";
            const docLabel = document.createElement("span"); docLabel.className = "doc-label"; docLabel.textContent = "Dokumen";
            const uploadBtn = document.createElement("button"); uploadBtn.className = "upload-btn"; uploadBtn.textContent = uploading ? "⏳ Memproses…" : "📎 Upload PDF";
            uploadBtn.disabled = uploading;
            uploadBtn.addEventListener("click", () => { if (!uploading) fileInput.click(); });
            docHead.appendChild(docLabel); docHead.appendChild(uploadBtn); docSec.appendChild(docHead);

            if (documents.length === 0 && !uploading) {
                const empty = document.createElement("div"); empty.className = "doc-empty"; empty.textContent = "Upload PDF supaya PrasMenjawab bisa jawab dari materi kamu.";
                docSec.appendChild(empty);
            } else {
                documents.forEach(doc => {
                    const item = document.createElement("div"); item.className = "doc-item";
                    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = selectedDocs.has(doc.id);
                    cb.addEventListener("change", () => { if (cb.checked) selectedDocs.add(doc.id); else selectedDocs.delete(doc.id); saveDocSelection(); updateDocBadge(); });
                    const info = document.createElement("div"); info.className = "doc-info";
                    const name = document.createElement("div"); name.className = "doc-name"; name.textContent = doc.name;
                    const meta = document.createElement("div"); meta.className = "doc-meta"; meta.textContent = doc.chunks.length + " potongan" + (doc.pages ? " · " + doc.pages + " halaman" : "");
                    info.appendChild(name); info.appendChild(meta);
                    const del = document.createElement("button"); del.className = "doc-del"; del.innerHTML = "×";
                    del.addEventListener("click", (e) => { e.stopPropagation(); deleteDoc(doc.id); updateDocBadge(); });
                    item.appendChild(cb); item.appendChild(info); item.appendChild(del); docSec.appendChild(item);
                });
            }
            sidebarList.appendChild(docSec);

            /* Separator */
            const sep = document.createElement("div"); sep.className = "sidebar-sep"; sidebarList.appendChild(sep);

            /* Conversation section */
            const cLabel = document.createElement("div"); cLabel.className = "sidebar-label"; cLabel.textContent = "Riwayat";
            sidebarList.appendChild(cLabel);

            if (!conversations.length) {
                const empty = document.createElement("div"); empty.className = "sidebar-empty"; empty.textContent = "Belum ada percakapan. Mulai tanya PrasMenjawab!"; sidebarList.appendChild(empty);
            } else {
                conversations.forEach(c => {
                    const item = document.createElement("div"); item.className = "conv-item" + (c.id === currentId ? " active" : "");
                    const main = document.createElement("div"); main.className = "conv-main";
                    const title = document.createElement("div"); title.className = "conv-title"; title.textContent = c.title || "Percakapan baru";
                    const meta = document.createElement("div"); meta.className = "conv-meta"; meta.textContent = fmtTime(c.updatedAt);
                    main.appendChild(title); main.appendChild(meta);
                    const del = document.createElement("button"); del.className = "conv-del"; del.title = "Hapus";
                    del.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
                    del.addEventListener("click", (e) => { e.stopPropagation(); deleteConversation(c.id); });
                    item.addEventListener("click", () => openConversation(c.id));
                    item.appendChild(main); item.appendChild(del); sidebarList.appendChild(item);
                });
            }

            updateDocBadge();
        }

        function saveDocSelection() {
            documents.forEach(d => { d.selected = selectedDocs.has(d.id); });
            saveJSON(DOCS_KEY, documents);
        }

        function openSidebar() { renderSidebar(); sidebar.classList.add("open"); backdrop.classList.add("show"); }
        function closeSidebar() { sidebar.classList.remove("open"); backdrop.classList.remove("show"); }

        /* ===== Events ===== */
        sendBtn.addEventListener("click", () => send(inputEl.value));
        landingSendBtn.addEventListener("click", () => send(landingInputEl.value));
        deleteBtn.addEventListener("click", () => { const c = currentConv(); if (c && confirm("Hapus percakapan ini?")) deleteConversation(c.id); });
        historyToggle.addEventListener("click", openSidebar);
        backdrop.addEventListener("click", closeSidebar);
        newChatBtn.addEventListener("click", () => { newConversation(); resetToLanding(); renderSidebar(); closeSidebar(); });
        [inputEl, landingInputEl].forEach(el => {
            el.addEventListener("input", () => autosize(el));
            el.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(el.value); } });
        });

        buildChips();
        updateDocBadge();
        landingInputEl.focus();

        /* Auto-refresh */
        let siteVersion = null;
        async function checkVersion() {
            try {
                const r = await fetch("/api/version", { cache: "no-store" });
                const d = await r.json();
                if (siteVersion === null) siteVersion = d.version;
                else if (d.version !== siteVersion) location.reload();
            } catch (_) {}
        }
        setInterval(checkVersion, 3000);
    </script>
</body>
</html>
